name: Complete synthetic release-service qualification
'on':
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter complete-service-qualification after exact operational
          authorization
        required: true
        type: string
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: tabgrad-release-publication
  cancel-in-progress: false
env:
  FIXTURE_ENABLED: ${{ vars.FIXTURE_ENABLED }}
  FIXTURE_CONFIRMATION: ${{ inputs.confirmation }}
jobs:
  precheck:
    name: precheck-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
    - name: Check out the frozen fixture
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out unchanged Tabgrad owners
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: isaacperez/tabgrad
        ref: 4dfedb34e5de873606f0cd6a1b1b5b04abf78752
        path: tabgrad
        persist-credentials: false
    - name: Select the identified controller
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.12.0
        check-latest: false
    - name: Run precheck
      run: node qualification.mjs precheck
      env:
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON
          }}
        GH_TOKEN: ${{ github.token }}
        FIXTURE_ROOT: ${{ runner.temp }}/service-qualification
        FIXTURE_SOURCE_DIRECTORY: ${{ github.workspace }}/tabgrad
      id: role
    - name: Identify the exact approval
      run: printf '%s\n' "$APPROVAL" >> "$GITHUB_STEP_SUMMARY"
      env:
        APPROVAL: ${{ steps.role.outputs.approval }}
    - name: Bound available output before transfer
      id: bounds
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      run: node qualification.mjs budget "$RUNNER_TEMP/service-qualification/public-output"
    - name: Retain available original observations
      id: retained
      if: ${{ always() && steps.bounds.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: service-precheck-${{ github.run_id }}
        path: ${{ runner.temp }}/service-qualification/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 30
    if: ${{ vars.FIXTURE_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main' && github.run_attempt == '1' && inputs.confirmation
      == 'complete-service-qualification' }}
  admit:
    name: admit-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
    - name: Check out the frozen fixture
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out unchanged Tabgrad owners
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: isaacperez/tabgrad
        ref: 4dfedb34e5de873606f0cd6a1b1b5b04abf78752
        path: tabgrad
        persist-credentials: false
    - name: Select the identified controller
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.12.0
        check-latest: false
    - name: Run admit
      run: node qualification.mjs admit
      env:
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON
          }}
        GH_TOKEN: ${{ github.token }}
        FIXTURE_ROOT: ${{ runner.temp }}/service-qualification
        FIXTURE_SOURCE_DIRECTORY: ${{ github.workspace }}/tabgrad
      id: role
    - name: Bound available output before transfer
      id: bounds
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      run: node qualification.mjs budget "$RUNNER_TEMP/service-qualification/public-output"
    - name: Retain available original observations
      id: retained
      if: ${{ always() && steps.bounds.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: service-admission-${{ github.run_id }}
        path: ${{ runner.temp }}/service-qualification/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 30
    needs:
    - precheck
    environment: tabgrad-npm-publication
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      digest: ${{ steps.retained.outputs.artifact-digest }}
      admission_sha: ${{ steps.role.outputs.admission_sha }}
  client:
    name: publish-approved-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
    - name: Check out the frozen fixture
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out unchanged Tabgrad owners
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: isaacperez/tabgrad
        ref: 4dfedb34e5de873606f0cd6a1b1b5b04abf78752
        path: tabgrad
        persist-credentials: false
    - name: Select the identified controller
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.12.0
        check-latest: false
    - name: Receive exact admission and control originals
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.admit.outputs.artifact_id }}
        github-token: ${{ github.token }}
        digest-mismatch: error
        path: ${{ runner.temp }}/service-qualification/admission
    - name: Run prepare
      run: node qualification.mjs prepare
      env:
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON
          }}
        GH_TOKEN: ${{ github.token }}
        FIXTURE_ROOT: ${{ runner.temp }}/service-qualification
        FIXTURE_SOURCE_DIRECTORY: ${{ github.workspace }}/tabgrad
        FIXTURE_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
        FIXTURE_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
        FIXTURE_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
      id: prepared
    - name: Readiness SHA256 ${{ steps.prepared.outputs.ready_sha }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: publication-ready-${{ github.run_id }}-${{ steps.prepared.outputs.ready_sha
          }}
        path: ${{ runner.temp }}/service-qualification/public-output/ready.json
        overwrite: false
        if-no-files-found: error
        retention-days: 30
    - name: Await observed permission
      run: node qualification.mjs select-permission
      env:
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON
          }}
        GH_TOKEN: ${{ github.token }}
        FIXTURE_ROOT: ${{ runner.temp }}/service-qualification
        FIXTURE_SOURCE_DIRECTORY: ${{ github.workspace }}/tabgrad
        FIXTURE_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
        FIXTURE_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
        FIXTURE_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
      id: selected
    - name: Receive exact observer permission
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ steps.selected.outputs.packet_id }}
        github-token: ${{ github.token }}
        digest-mismatch: error
        path: ${{ runner.temp }}/service-qualification/received-permission
    - name: Exercise the deliberate no-npm-dispatch boundary
      run: node qualification.mjs execute
      env:
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON
          }}
        GH_TOKEN: ${{ github.token }}
        FIXTURE_ROOT: ${{ runner.temp }}/service-qualification
        FIXTURE_SOURCE_DIRECTORY: ${{ github.workspace }}/tabgrad
        FIXTURE_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
        FIXTURE_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
        FIXTURE_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
      id: role
    - name: Bound available output before transfer
      id: bounds
      if: ${{ always() && steps.prepared.outcome != 'skipped' }}
      run: node qualification.mjs budget "$RUNNER_TEMP/service-qualification/public-output"
    - name: Retain available original observations
      id: retained
      if: ${{ always() && steps.bounds.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: service-client-${{ github.run_id }}
        path: ${{ runner.temp }}/service-qualification/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 30
    needs:
    - precheck
    - admit
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      digest: ${{ steps.retained.outputs.artifact-digest }}
  gate:
    name: observe-ready-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
    - name: Check out the frozen fixture
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out unchanged Tabgrad owners
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: isaacperez/tabgrad
        ref: 4dfedb34e5de873606f0cd6a1b1b5b04abf78752
        path: tabgrad
        persist-credentials: false
    - name: Select the identified controller
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.12.0
        check-latest: false
    - name: Receive exact admission and control originals
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.admit.outputs.artifact_id }}
        github-token: ${{ github.token }}
        digest-mismatch: error
        path: ${{ runner.temp }}/service-qualification/admission
    - name: Run select-ready
      run: node qualification.mjs select-ready
      env:
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON
          }}
        GH_TOKEN: ${{ github.token }}
        FIXTURE_ROOT: ${{ runner.temp }}/service-qualification
        FIXTURE_SOURCE_DIRECTORY: ${{ github.workspace }}/tabgrad
        FIXTURE_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
        FIXTURE_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
        FIXTURE_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
      id: selected
    - name: Receive exact prepared readiness
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ steps.selected.outputs.packet_id }}
        github-token: ${{ github.token }}
        digest-mismatch: error
        path: ${{ runner.temp }}/service-qualification/received-ready
    - name: Verify current authority, attribution, intent and draft
      run: node qualification.mjs permit
      env:
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON
          }}
        GH_TOKEN: ${{ github.token }}
        FIXTURE_ROOT: ${{ runner.temp }}/service-qualification
        FIXTURE_SOURCE_DIRECTORY: ${{ github.workspace }}/tabgrad
        FIXTURE_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
        FIXTURE_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
        FIXTURE_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
      id: permission
    - name: Permission SHA256 ${{ steps.permission.outputs.permission_sha }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: publication-permission-${{ github.run_id }}-${{ steps.permission.outputs.permission_sha
          }}
        path: ${{ runner.temp }}/service-qualification/public-output/permission.json
        overwrite: false
        if-no-files-found: error
        retention-days: 30
    - name: Bound available output before transfer
      id: bounds
      if: ${{ always() }}
      run: node qualification.mjs budget "$RUNNER_TEMP/service-qualification/public-output"
    - name: Retain available original observations
      id: retained
      if: ${{ always() && steps.bounds.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: service-observer-${{ github.run_id }}
        path: ${{ runner.temp }}/service-qualification/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 30
    needs:
    - precheck
    - admit
  observe:
    name: record-npm-outcome
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
    - name: Check out the frozen fixture
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out unchanged Tabgrad owners
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: isaacperez/tabgrad
        ref: 4dfedb34e5de873606f0cd6a1b1b5b04abf78752
        path: tabgrad
        persist-credentials: false
    - name: Select the identified controller
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.12.0
        check-latest: false
    - name: Receive exact admission and control originals
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.admit.outputs.artifact_id }}
        github-token: ${{ github.token }}
        digest-mismatch: error
        path: ${{ runner.temp }}/service-qualification/admission
    - name: Receive the actual no-effect client receipt
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.client.outputs.artifact_id }}
        github-token: ${{ github.token }}
        digest-mismatch: error
        path: ${{ runner.temp }}/service-qualification/npm-result
      if: ${{ needs.client.outputs.artifact_id != '' }}
    - name: Record the attributed no-effect and prove completion is blocked
      run: node qualification.mjs observe
      env:
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON
          }}
        GH_TOKEN: ${{ github.token }}
        FIXTURE_ROOT: ${{ runner.temp }}/service-qualification
        FIXTURE_SOURCE_DIRECTORY: ${{ github.workspace }}/tabgrad
        FIXTURE_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
        FIXTURE_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
        FIXTURE_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
        FIXTURE_RESULT_ID: ${{ needs.client.outputs.artifact_id }}
        FIXTURE_RESULT_DIGEST: ${{ needs.client.outputs.digest }}
        FIXTURE_CLIENT_RESULT: ${{ needs.client.result }}
      id: role
    - name: Bound available output before transfer
      id: bounds
      if: ${{ always() }}
      run: node qualification.mjs budget "$RUNNER_TEMP/service-qualification/public-output"
    - name: Retain available original observations
      id: retained
      if: ${{ always() && steps.bounds.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: service-observed-${{ github.run_id }}
        path: ${{ runner.temp }}/service-qualification/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 30
    needs:
    - precheck
    - admit
    - client
    - gate
    if: ${{ always() && !cancelled() && needs.admit.result == 'success' }}
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      digest: ${{ steps.retained.outputs.artifact-digest }}
  complete:
    name: qualify-synthetic-github-completion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
    - name: Check out the frozen fixture
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out unchanged Tabgrad owners
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: isaacperez/tabgrad
        ref: 4dfedb34e5de873606f0cd6a1b1b5b04abf78752
        path: tabgrad
        persist-credentials: false
    - name: Select the identified controller
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.12.0
        check-latest: false
    - name: Receive exact admission and control originals
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.admit.outputs.artifact_id }}
        github-token: ${{ github.token }}
        digest-mismatch: error
        path: ${{ runner.temp }}/service-qualification/admission
    - name: Receive authenticated settlement and original history
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.observe.outputs.artifact_id }}
        github-token: ${{ github.token }}
        digest-mismatch: error
        path: ${{ runner.temp }}/service-qualification/observed
    - name: Qualify separate synthetic GitHub-only completion
      run: node qualification.mjs complete
      env:
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON
          }}
        GH_TOKEN: ${{ github.token }}
        FIXTURE_ROOT: ${{ runner.temp }}/service-qualification
        FIXTURE_SOURCE_DIRECTORY: ${{ github.workspace }}/tabgrad
        FIXTURE_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
        FIXTURE_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
        FIXTURE_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
        FIXTURE_SETTLED_ID: ${{ needs.observe.outputs.artifact_id }}
        FIXTURE_SETTLED_DIGEST: ${{ needs.observe.outputs.digest }}
      id: role
    - name: Bound available output before transfer
      id: bounds
      if: ${{ always() }}
      run: node qualification.mjs budget "$RUNNER_TEMP/service-qualification/public-output"
    - name: Retain available original observations
      id: retained
      if: ${{ always() && steps.bounds.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: service-complete-${{ github.run_id }}
        path: ${{ runner.temp }}/service-qualification/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 30
    needs:
    - precheck
    - admit
    - observe
