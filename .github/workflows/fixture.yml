name: Synthetic publication-access diagnostics
'on':
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter publication-access-probe after separate operational authorization
        type: string
        required: true
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: tabgrad-release-publication
  cancel-in-progress: false
env:
  PROBE_ENABLED: ${{ vars.PROBE_ENABLED }}
  PROBE_CONFIRMATION: ${{ inputs.confirmation }}
  PROBE_PROFILE_JSON: ${{ vars.PROBE_PROFILE_JSON }}
  PROBE_PROFILE_SHA256: ${{ vars.PROBE_PROFILE_SHA256 }}
jobs:
  precheck:
    name: probe-precheck
    if: ${{ vars.PROBE_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && inputs.confirmation == 'publication-access-probe' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: isaacperez/tabgrad
        ref: bcdbdd0577c8dac9e9376b9c2a73e2e841a3e1b2
        path: tabgrad
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.12.0
        check-latest: false
    - name: Observe the protected context and synthetic input controls
      id: role
      run: node probe.mjs precheck
      env:
        GH_TOKEN: ${{ github.token }}
        PROBE_OUTPUT_DIRECTORY: ${{ runner.temp }}/probe-precheck
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON }}
    - name: Check the finite observation budget
      id: budget
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      run: node probe.mjs budget "$PROBE_OUTPUT_DIRECTORY"
      env:
        PROBE_OUTPUT_DIRECTORY: ${{ runner.temp }}/probe-precheck
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() && steps.budget.outcome == 'success' }}
      with:
        name: access-probe-precheck-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/probe-precheck
        overwrite: false
        if-no-files-found: error
        retention-days: 30
    outputs:
      admitted: ${{ steps.role.outputs.admitted }}
      approval: ${{ steps.role.outputs.approval }}
  writer:
    name: probe-writer
    needs: precheck
    if: ${{ needs.precheck.outputs.admitted == 'true' }}
    environment: tabgrad-npm-publication
    permissions:
      contents: write
      actions: read
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: isaacperez/tabgrad
        ref: bcdbdd0577c8dac9e9376b9c2a73e2e841a3e1b2
        path: tabgrad
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.12.0
        check-latest: false
    - name: Compare known resources and attempt one admitted note update
      id: role
      run: node probe.mjs writer
      env:
        GH_TOKEN: ${{ github.token }}
        PROBE_OUTPUT_DIRECTORY: ${{ runner.temp }}/probe-writer
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON }}
    - name: Check the finite observation budget
      id: budget
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      run: node probe.mjs budget "$PROBE_OUTPUT_DIRECTORY"
      env:
        PROBE_OUTPUT_DIRECTORY: ${{ runner.temp }}/probe-writer
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() && steps.budget.outcome == 'success' }}
      with:
        name: access-probe-writer-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/probe-writer
        overwrite: false
        if-no-files-found: error
        retention-days: 30
  reader:
    name: probe-reader
    needs: [precheck, writer]
    if: ${{ always() && !cancelled() && needs.precheck.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: isaacperez/tabgrad
        ref: bcdbdd0577c8dac9e9376b9c2a73e2e841a3e1b2
        path: tabgrad
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.12.0
        check-latest: false
    - name: Observe known draft and asset with the reader token
      id: role
      run: node probe.mjs reader
      env:
        GH_TOKEN: ${{ github.token }}
        PROBE_OUTPUT_DIRECTORY: ${{ runner.temp }}/probe-reader
        TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
        TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
        TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON }}
    - name: Check the finite observation budget
      id: budget
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      run: node probe.mjs budget "$PROBE_OUTPUT_DIRECTORY"
      env:
        PROBE_OUTPUT_DIRECTORY: ${{ runner.temp }}/probe-reader
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() && steps.budget.outcome == 'success' }}
      with:
        name: access-probe-reader-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/probe-reader
        overwrite: false
        if-no-files-found: error
        retention-days: 30
